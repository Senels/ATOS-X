name: ATOS-X Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atos-x-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          pwd
          test -f backend/pyproject.toml
          test -f backend/README.md

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Dependency integrity check
        working-directory: backend
        run: python -m pip check

      - name: Compile check
        working-directory: backend
        run: python -m compileall -q app tests

      - name: Import smoke check
        working-directory: backend
        env:
          ATOS_TEST_MODE: "1"
        run: |
          python -c "from app.backtest.ai_gate import evaluate_signal; print('ai_gate import OK')"
          python -c "from app.dashboard.operational_view import build_operational_view; print('dashboard import OK')"

      - name: Dependency-free CI smoke tests
        working-directory: backend
        env:
          ATOS_TEST_MODE: "1"
        run: python -m pytest -q tests/test_ci_smoke.py

      - name: Unit and regression tests
        working-directory: backend
        env:
          ATOS_TEST_MODE: "1"
        run: python -m pytest -q
