name: ATOS-X Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atos-x-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile check
        working-directory: backend
        run: python -m compileall -q app tests

      - name: Import smoke check
        working-directory: backend
        env:
          ATOS_TEST_MODE: "1"
        run: python -c "from app.backtest.ai_gate import evaluate_signal; from app.dashboard.operational_view import build_operational_view; print('ATOS-X imports OK')"

      - name: Unit and regression tests
        working-directory: backend
        env:
          ATOS_TEST_MODE: "1"
        run: python -m pytest -q
