name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint (ruff)
        run: cd backend && ruff check app tests --select E9,F63,F7,F82,F,I
      - name: Syntax check
        run: python -m compileall -q backend/app backend/tests
      - name: Pytest
        env:
          ATOS_TEST_MODE: "1"
        run: pytest backend/tests -q

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3
      - name: Docker image oluştur (push yok)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: atos-x:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
