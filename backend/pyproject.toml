[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atos-x"
version = "1.0.0"
description = "Enterprise Autonomous Trading Operating System for Binance Futures"
authors = [{name = "Senels"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn>=0.41.0",
    "websockets>=15.0.0",
    "aiohttp>=3.12.0",
    "python-binance>=1.0.19",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "sqlalchemy>=2.0.0",
    "loguru>=0.7.0",
    "prometheus-client>=0.20.0",
    "pydantic-settings>=2.13.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "certifi>=2026.0.0",
    "urllib3>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "ruff>=0.9.0",
    "pytest-asyncio>=0.23.0"
]
ai = [
    "scikit-learn>=1.3.0",
    "tensorflow>=2.15.0",
    "joblib>=1.3.0"
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v -p no:pytest_ethereum"
