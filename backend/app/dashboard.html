<!DOCTYPE html>
<html>
<head>
<title>ATOS X Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f172a; color:#f1f5f9; font-family:'Segoe UI',Arial,sans-serif; padding:16px; }
.container { max-width:1400px; margin:0 auto; }
.header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid #1e293b; }
.header h1 { font-size:28px; background:linear-gradient(135deg,#f59e0b,#3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.header-right { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.btn { background:#3b82f6; border:none; color:white; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13px; transition:0.2s; }
.btn:hover { background:#2563eb; transform:scale(1.02); }
.btn-red { background:#ef4444; }
.btn-red:hover { background:#dc2626; }
.btn-green { background:#22c55e; }
.btn-green:hover { background:#16a34a; }
.settings-link { color:#f59e0b; text-decoration:none; font-size:13px; padding:6px 12px; border:1px solid #f59e0b; border-radius:6px; transition:0.2s; }
.settings-link:hover { background:#f59e0b; color:#0f172a; }
.stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
.stat-box { background:#0f172a; padding:12px 16px; border-radius:8px; border:1px solid #1e293b; text-align:center; }
.stat-box .label { font-size:11px; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px; }
.stat-box .value { font-size:22px; font-weight:bold; margin-top:4px; }
.stat-box .value.green { color:#22c55e; }
.stat-box .value.red { color:#ef4444; }
.stat-box .value.yellow { color:#f59e0b; }
.card { background:#1e293b; padding:16px; border-radius:12px; border:1px solid #334155; margin-bottom:16px; }
.card h3 { margin-bottom:12px; font-size:16px; color:#94a3b8; }
.table-wrap { overflow-x:auto; }
table { width:100%; font-size:13px; border-collapse:collapse; }
th,td { padding:8px 10px; text-align:left; border-bottom:1px solid #1e293b; }
th { color:#94a3b8; font-weight:500; font-size:11px; text-transform:uppercase; }
tr:hover { background:rgba(59,130,246,0.05); }
.status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
.status-online { background:#22c55e; animation:pulse 2s infinite; }
.status-offline { background:#ef4444; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
.badge-buy { background:#22c55e; color:white; padding:2px 10px; border-radius:12px; font-size:12px; }
.badge-sell { background:#ef4444; color:white; padding:2px 10px; border-radius:12px; font-size:12px; }
.badge-hold { background:#f59e0b; color:#0f172a; padding:2px 10px; border-radius:12px; font-size:12px; }
.refresh-info { font-size:12px; color:#64748b; margin-top:8px; text-align:right; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🚀 ATOS X</h1>
<div class="header-right">
<span id="statusBadge"><span class="status-dot status-online"></span>ONLINE</span>
<a href="/dashboard/settings" class="settings-link">⚙️ Settings</a>
<button class="btn" onclick="refresh()">🔄 Refresh</button>
<button class="btn btn-red" onclick="emergencyStop()">🛑 Stop</button>
</div>
</div>
<div class="stats-row">
<div class="stat-box"><div class="label">Coins</div><div class="value" id="totalCoins">-</div></div>
<div class="stat-box"><div class="label">Positions</div><div class="value" id="positions">0</div></div>
<div class="stat-box"><div class="label">Trades</div><div class="value" id="totalTrades">0</div></div>
<div class="stat-box"><div class="label">Equity</div><div class="value green" id="equity">$10k</div></div>
<div class="stat-box"><div class="label">Status</div><div class="value green" id="statusText">Active</div></div>
</div>
<div class="card"><h3>📊 Active Positions</h3><div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Side</th><th>Entry</th><th>Qty</th><th>SL</th><th>TP</th><th>Time</th></tr></thead><tbody id="positionsBody"><tr><td colspan="7" style="text-align:center;color:#64748b;padding:20px;">No active positions</td></tr></tbody></table></div></div>
<div class="card"><h3>📋 Trade History</h3><div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>PnL</th><th>Reason</th><th>Time</th></tr></thead><tbody id="tradesBody"><tr><td colspan="7" style="text-align:center;color:#64748b;padding:20px;">No trades yet</td></tr></tbody></table></div></div>
<div class="refresh-info" id="lastUpdate">Last update: -</div>
</div>
<script>
async function refresh() {
try {
const r = await fetch('/dashboard/metrics');
const d = await r.json();
if (d.error) { document.getElementById('statusBadge').innerHTML = '<span class="status-dot status-offline"></span>ERROR'; return; }
document.getElementById('totalCoins').textContent = d.symbols || 0;
document.getElementById('positions').textContent = d.active_positions || 0;
document.getElementById('totalTrades').textContent = d.total_trades || 0;
document.getElementById('equity').textContent = '$' + (d.equity || 10000).toLocaleString();
document.getElementById('statusText').textContent = d.status || 'Active';
const posBody = document.getElementById('positionsBody');
if (d.positions && Object.keys(d.positions).length > 0) {
posBody.innerHTML = '';
for (const [symbol, pos] of Object.entries(d.positions)) {
posBody.innerHTML += '<tr><td><strong>'+symbol+'</strong></td><td><span class="badge-'+(pos.side==='BUY'?'buy':'sell')+'">'+pos.side+'</span></td><td>$'+pos.entry_price+'</td><td>'+pos.quantity+'</td><td>$'+(pos.sl||'-')+'</td><td>$'+(pos.tp||'-')+'</td><td>'+(pos.open_time?new Date(pos.open_time).toLocaleString():'-')+'</td></tr>';
}
} else { posBody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#64748b;padding:20px;">No active positions</td></tr>'; }
const tr = await fetch('/api/v1/trades');
const td = await tr.json();
const tradeBody = document.getElementById('tradesBody');
if (td.trades && td.trades.length > 0) {
tradeBody.innerHTML = '';
td.trades.slice(0,20).forEach(function(t) {
tradeBody.innerHTML += '<tr><td><strong>'+(t.symbol||'-')+'</strong></td><td><span class="badge-'+(t.side==='BUY'?'buy':'sell')+'">'+(t.side||'-')+'</span></td><td>$'+(t.entry?t.entry.toFixed(2):'-')+'</td><td>$'+(t.exit?t.exit.toFixed(2):'-')+'</td><td style="color:'+(t.pnl>0?'#22c55e':'#ef4444')+'">'+(t.pnl?'$'+t.pnl.toFixed(2):'-')+'</td><td>'+(t.reason||'-')+'</td><td>'+(t.time?new Date(t.time).toLocaleString():'-')+'</td></tr>';
});
}
document.getElementById('lastUpdate').textContent = 'Last update: ' + new Date().toLocaleString();
} catch(e) { console.error(e); }
}
async function emergencyStop() {
if (confirm('Tum pozisyonlari kapatmak istediginize emin misiniz?')) {
const r = await fetch('/api/v1/emergency_stop', { method: 'POST' });
const d = await r.json();
alert('🛑 ' + d.message);
refresh();
}
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
