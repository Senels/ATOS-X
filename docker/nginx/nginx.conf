events {
    worker_connections 1024;
}

http {
    upstream atos_backend {
        server atos-backend:8000;
    }

    # HTTP -> HTTPS yönlendirme (SSL etkinleştirilince uncomment)
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        server_name _;

        # Güvenlik başlıkları
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # API proxy
        location /api/ {
            proxy_pass http://atos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # WebSocket desteği (backtest stream vb.)
        location /ws/ {
            proxy_pass http://atos_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # Sağlık kontrolü
        location /health {
            proxy_pass http://atos_backend;
        }

        # Dashboard
        location / {
            proxy_pass http://atos_backend;
        }
    }

    # HTTPS sunucusu (SSL sertifikaları hazır olduğunda etkinleştirin)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     location / {
    #         proxy_pass http://atos_backend;
    #         proxy_set_header Host $host;
    #     }
    # }
}
