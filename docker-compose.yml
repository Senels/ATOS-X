services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: atosx
      POSTGRES_PASSWORD: atosx
      POSTGRES_DB: atosx
    ports:
      - "5432:5432"
    volumes:
      - atosx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atosx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - atosx_redisdata:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://atosx:atosx@db:5432/atosx
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  atosx_pgdata:
  atosx_redisdata:
