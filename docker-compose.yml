version: "3.9"

services:
  # ── ATOS X Backend ─────────────────────────────────────────────────────────
  atos-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: atos-x:latest
    container_name: atos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app/backend
      - DB_PATH=/app/data/atos.db
    volumes:
      # Kalıcı veritabanı dizini (volume, dosya yoluna değil dizine mount edilir)
      - atos-db:/app/data
      # Yerel OHLCV arşivi (read-only)
      - ./legacy:/app/legacy:ro
      # Strateji ayarları (kalıcı)
      - ./backend/app/strategy/settings.json:/app/backend/app/strategy/settings.json
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - atos-net

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  atos-nginx:
    image: nginx:1.25-alpine
    container_name: atos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL sertifikaları (Let's Encrypt için):
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - atos-backend
    networks:
      - atos-net

volumes:
  atos-db:
    name: atos-db

networks:
  atos-net:
    driver: bridge
